<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pengaturan — Admin Meity Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrap">
<nav class="admin-nav" id="admin-nav" aria-label="Menu admin"></nav>
<main class="admin-main">
<h1>Pengaturan</h1>
<form class="stack" id="form-settings" style="max-width: 720px">
  <div class="card stack">
    <h3 style="margin: 0">Bisnis</h3>
    <div class="form-grid">
      <div class="field"><label for="business_name">Nama bisnis</label><input id="business_name" name="business_name" required></div>
      <div class="field"><label for="wa_number">Nomor WhatsApp artis</label><input id="wa_number" name="wa_number" type="tel" required><span class="hint">Tujuan pesan dari pelanggan.</span></div>
      <div class="field"><label for="instagram">Instagram (opsional)</label><input id="instagram" name="instagram" placeholder="@meityart"></div>
    </div>
  </div>
  <div class="card stack">
    <h3 style="margin: 0">Aturan jadwal</h3>
    <div class="form-grid">
      <div class="field"><label for="slot_interval_min">Interval slot</label>
        <select id="slot_interval_min" name="slot_interval_min"><option value="15">15 menit</option><option value="30">30 menit</option><option value="60">60 menit</option></select></div>
      <div class="field"><label for="buffer_min">Buffer antar booking (menit)</label><input id="buffer_min" name="buffer_min" type="number" min="0" step="5"><span class="hint">Waktu perjalanan &amp; beres-beres.</span></div>
      <div class="field"><label for="min_notice_hours">Minimal booking sebelum (jam)</label><input id="min_notice_hours" name="min_notice_hours" type="number" min="0"></div>
      <div class="field"><label for="max_days_ahead">Maksimal booking ke depan (hari)</label><input id="max_days_ahead" name="max_days_ahead" type="number" min="1"></div>
      <div class="field"><label for="max_bookings_per_day">Maksimal booking per hari</label><input id="max_bookings_per_day" name="max_bookings_per_day" type="number" min="1"></div>
      <div class="field"><label for="pending_expiry_days">Batas approve (hari)</label><input id="pending_expiry_days" name="pending_expiry_days" type="number" min="1"><span class="hint">Lewat dari ini booking pending otomatis batal.</span></div>
    </div>
  </div>
  <div class="row"><span class="spacer"></span><button class="btn btn-primary" type="submit">Simpan pengaturan</button></div>
</form>
</main>
</div>
<script type="module" src="../js/admin/pengaturan.js"></script>
</body>
</html>
