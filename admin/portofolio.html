<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portofolio — Admin Meity Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrap">
<nav class="admin-nav" id="admin-nav" aria-label="Menu admin"></nav>
<main class="admin-main">
<h1>Portofolio</h1>
<form class="card stack" id="form-upload" style="margin-bottom: 24px">
  <h3 style="margin: 0">Upload hasil kerja</h3>
  <div class="form-grid">
    <div class="field"><label for="pf-file">Foto (bisa pilih beberapa)</label><input id="pf-file" type="file" accept="image/*" multiple required></div>
    <div class="field"><label for="pf-service">Layanan terkait (opsional)</label><select id="pf-service"><option value="">—</option></select></div>
  </div>
  <div class="field"><label for="pf-caption">Keterangan (opsional)</label><input id="pf-caption" placeholder="Contoh: French tip + glitter"></div>
  <div class="row"><span class="spacer"></span><button class="btn btn-primary" type="submit">Upload</button></div>
</form>
<div class="gallery" id="gallery"><div class="empty">Memuat…</div></div>
</main>
</div>
<script type="module" src="../js/admin/portofolio.js"></script>
</body>
</html>
