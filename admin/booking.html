<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Booking — Admin Meity Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrap">
<nav class="admin-nav" id="admin-nav" aria-label="Menu admin"></nav>
<main class="admin-main">
<h1>Booking</h1>
<div class="tabs" id="tabs" role="group" aria-label="Filter status">
  <button type="button" data-status="pending">Menunggu</button>
  <button type="button" data-status="confirmed">Terkonfirmasi</button>
  <button type="button" data-status="done">Selesai</button>
  <button type="button" data-status="cancelled,rejected,no_show">Batal / Ditolak</button>
  <button type="button" data-status="all">Semua</button>
</div>
<div class="row" style="margin-bottom: 16px">
  <input id="search" type="search" placeholder="Cari nama, kode, atau nomor WA" aria-label="Cari booking" style="max-width: 360px">
</div>
<div class="list" id="list"><div class="empty">Memuat…</div></div>
</main>
</div>
<script type="module" src="../js/admin/booking.js"></script>
</body>
</html>
